name: Polar Station release
run-name: ${{ startsWith(github.ref_name, 'station-operator-') && 'operator' || inputs.phase || 'build' }} ${{ inputs.tools_sha256 || '059fef6c03183a47f34b48ce806cebef9e634802facbfe71670ae9a0c33112c3' }}
on:
  push:
    tags: ['station-build-*', 'station-operator-*']
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [build, review, publish]
        default: build
        required: true
      tools_asset:
        description: Exact private draft tool archive asset ID
        required: true
      tools_sha256:
        description: Reviewed tool archive SHA-256
        required: true
permissions: {}
concurrency:
  group: station-release-${{ inputs.phase || 'build' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  operator:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'station-operator-') && github.repository == 'lionantbear/polar-station' && github.actor == 'lionantbear'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    steps:
      - name: Owner SSH release operations
        id: ssh
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          limit-access-to-users: lionantbear
          full-access: true
          upterm-version: v0.41.1
          wait-timeout-minutes: 5
          detached: true
      - name: Record SSH connection address
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh-config }}
        run: printf '%s\n' "$SSH_CONFIG" > "$RUNNER_TEMP/station-ssh-config"
      - name: Retain SSH connection address
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: station-ssh-connection
          path: ${{ runner.temp }}/station-ssh-config
          retention-days: 1
          if-no-files-found: error
  native:
    if: github.event_name != 'push' || startsWith(github.ref_name, 'station-build-')
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CARGO_BUILD_JOBS: '3'
      POLAR_GRAPHICS_JOBS: '3'
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      release_metadata: ${{ steps.publish.outputs.release_metadata }}
      godot_key: ${{ steps.godot-key.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Load exact private release tools
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_ASSET: ${{ inputs.tools_asset }}
          TOOL_SHA: ${{ inputs.tools_sha256 || '059fef6c03183a47f34b48ce806cebef9e634802facbfe71670ae9a0c33112c3' }}
        run: |
          set -euo pipefail
          export POLAR_STATION_RELEASE_TOOLS="$RUNNER_TEMP/station-release-tools"
          echo "POLAR_STATION_RELEASE_TOOLS=$POLAR_STATION_RELEASE_TOOLS" >> "$GITHUB_ENV"
          [[ "$TOOL_SHA" =~ ^[a-f0-9]{64}$ ]]
          if [[ -z "$TOOL_ASSET" ]]; then
            TOOL_ASSET=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == true) | .assets[] | select(.name == \"release-tools-$TOOL_SHA.tar.gz\") | .id")
          fi
          [[ "$TOOL_ASSET" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$TOOL_ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/tools.tar.gz"
          printf '%s  %s\n' "$TOOL_SHA" "$RUNNER_TEMP/tools.tar.gz" | shasum -a 256 --check
          mkdir "$POLAR_STATION_RELEASE_TOOLS"
          python3 -c 'import os,tarfile; tarfile.open(os.environ["RUNNER_TEMP"]+"/tools.tar.gz").extractall(os.environ["POLAR_STATION_RELEASE_TOOLS"],filter="data")'
      - name: Verify exact application source
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" verify
      - name: Prepare pinned build dependencies
        if: github.event_name == 'push' || inputs.phase == 'build'
        env:
          POLAR_STATION_ZIG: ${{ runner.temp }}/station-native/zig-aarch64-macos-0.15.2/zig
        run: bash "$POLAR_STATION_RELEASE_TOOLS/prepare.sh"
      - name: Compute Godot dependency identity
        id: godot-key
        if: github.event_name == 'push' || inputs.phase == 'build'
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" godot-key
      - name: Restore verified Godot dependency
        id: godot-cache
        if: github.event_name == 'push' || inputs.phase == 'build'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.godot-key.outputs.key }}
          path: ${{ runner.temp }}/station-godot-cache
      - name: Restore Cargo downloads and external dependency outputs
        id: rust-cache
        if: github.event_name == 'push' || inputs.phase == 'build'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target/rust
          shared-key: station-macos-arm64-${{ steps.godot-key.outputs.rust_native_key }}
          env-vars: DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET SDKROOT
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          cache-all-crates: 'false'
          cache-on-failure: 'true'
          save-if: ${{ github.ref == 'refs/heads/release/macos-current' }}
      - name: Build through public entry and collect private observations
        if: github.event_name == 'push' || inputs.phase == 'build'
        env:
          POLAR_STATION_RUST_CACHE_EXACT_MATCH: ${{ steps.rust-cache.outputs.cache-hit }}
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" build
      - name: Check application and package actual inputs
        if: github.event_name == 'push' || inputs.phase == 'build'
        run: bash "$POLAR_STATION_RELEASE_TOOLS/collect.sh"
      - name: Save validated Godot dependency
        if: inputs.phase == 'build' && github.ref == 'refs/heads/release/macos-current' && steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.godot-key.outputs.key }}
          path: ${{ runner.temp }}/station-godot-cache
      - name: Retain build in an unpublished draft
        if: github.event_name == 'push' || inputs.phase == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$POLAR_STATION_RELEASE_TOOLS/retain.sh"
      - name: Inspect current artifact and retain private report
        if: inputs.phase == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" review
      - name: Validate exact publication approval
        if: inputs.phase == 'publish'
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" validate
      - name: Fetch approved artifact
        if: inputs.phase == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" fetch
      - name: Package and statically verify approved artifact
        if: inputs.phase == 'publish'
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" package
      - name: Publish approved candidate
        id: publish
        if: inputs.phase == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" publish
  public-download:
    if: inputs.phase == 'publish'
    needs: native
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      # GitHub requires draft-capable access to load the private tool attachment.
      # The finalizer's public download operation uses its GET-only client.
      contents: write
      actions: read
    steps:
      - name: Load the same exact private release tools
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_ASSET: ${{ inputs.tools_asset }}
          TOOL_SHA: ${{ inputs.tools_sha256 }}
        run: |
          set -euo pipefail
          export POLAR_STATION_RELEASE_TOOLS="$RUNNER_TEMP/station-release-tools"
          echo "POLAR_STATION_RELEASE_TOOLS=$POLAR_STATION_RELEASE_TOOLS" >> "$GITHUB_ENV"
          [[ "$TOOL_ASSET" =~ ^[1-9][0-9]*$ && "$TOOL_SHA" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$TOOL_ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/tools.tar.gz"
          printf '%s  %s\n' "$TOOL_SHA" "$RUNNER_TEMP/tools.tar.gz" | shasum -a 256 --check
          mkdir "$POLAR_STATION_RELEASE_TOOLS"
          python3 -c 'import os,tarfile; tarfile.open(os.environ["RUNNER_TEMP"]+"/tools.tar.gz").extractall(os.environ["POLAR_STATION_RELEASE_TOOLS"],filter="data")'
      - name: Download and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_METADATA: ${{ needs.native.outputs.release_metadata }}
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" fetch-public
      - name: Check installed copy without credentials
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" launch-public
  godot-reuse-check:
    needs: native
    if: inputs.phase == 'build' && github.ref == 'refs/heads/release/macos-current'
    runs-on: macos-26
    permissions:
      # Private draft attachments require draft-capable access.
      contents: write
    env:
      EXPECTED_GODOT_KEY: ${{ needs.native.outputs.godot_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Load exact private release tools
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_ASSET: ${{ inputs.tools_asset }}
          TOOL_SHA: ${{ inputs.tools_sha256 || '059fef6c03183a47f34b48ce806cebef9e634802facbfe71670ae9a0c33112c3' }}
        run: |
          set -euo pipefail
          export POLAR_STATION_RELEASE_TOOLS="$RUNNER_TEMP/station-release-tools"
          echo "POLAR_STATION_RELEASE_TOOLS=$POLAR_STATION_RELEASE_TOOLS" >> "$GITHUB_ENV"
          [[ "$TOOL_SHA" =~ ^[a-f0-9]{64}$ ]]
          if [[ -z "$TOOL_ASSET" ]]; then
            TOOL_ASSET=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == true) | .assets[] | select(.name == \"release-tools-$TOOL_SHA.tar.gz\") | .id")
          fi
          [[ "$TOOL_ASSET" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$TOOL_ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/tools.tar.gz"
          printf '%s  %s\n' "$TOOL_SHA" "$RUNNER_TEMP/tools.tar.gz" | shasum -a 256 --check
          mkdir "$POLAR_STATION_RELEASE_TOOLS"
          python3 -c 'import os,tarfile; tarfile.open(os.environ["RUNNER_TEMP"]+"/tools.tar.gz").extractall(os.environ["POLAR_STATION_RELEASE_TOOLS"],filter="data")'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ needs.native.outputs.godot_key }}
          path: ${{ runner.temp }}/station-godot-cache
          fail-on-cache-miss: true
      - name: Validate reused native library on a fresh runner
        run: python3 "$POLAR_STATION_RELEASE_TOOLS/release_ci.py" verify-godot-reuse
