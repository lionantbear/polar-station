name: Correct and validate microphone signature
# Terminal completion and intentional GUI residency are checked before publish.
on:
  workflow_dispatch:
  push:
    branches: [release/macos-current-source-20261111]
    paths: ['.github/workflows/macos-microphone-fix.yml']
permissions:
  contents: read
concurrency:
  group: macos-microphone-fix
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: automation/polar_station
      - name: Download exact reviewed public trial
        run: |
          curl --fail --location --retry 3 'https://github.com/lionantbear/polar-station/releases/download/macos-arm64-trial-43099863954-1/Polar-Station-macOS-arm64-TRIAL-UNNOTARIZED.dmg' -o "$RUNNER_TEMP/original.dmg"
          echo "fb5b65699fae31691d685888312fb44c858b30eef94e521eb059a533df8480aa  $RUNNER_TEMP/original.dmg" | shasum -a 256 -c -
      - name: Correct signing and test installed final DMG without publish credentials
        run: |
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          python3 automation/polar_station/package_launch_fix.py --original "$RUNNER_TEMP/original.dmg" --work "$RUNNER_TEMP/launch-fix" \
            --original-sha256 fb5b65699fae31691d685888312fb44c858b30eef94e521eb059a533df8480aa \
            --required-entitlement com.apple.security.device.audio-input
      - name: Print retained launch evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/launch-fix/launchservices.json" ]; then cat "$RUNNER_TEMP/launch-fix/launchservices.json"; fi
          for name in result.json app.stderr app.stdout terminal-sentinel.trace processes.txt; do
            if [ -f "$RUNNER_TEMP/launch-fix/launch-evidence/$name" ]; then
              echo "=== $name ==="
              cat "$RUNNER_TEMP/launch-fix/launch-evidence/$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: validated-trial
          path: |
            ${{ runner.temp }}/launch-fix/public/*
            ${{ runner.temp }}/launch-fix/validation.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-evidence
          path: ${{ runner.temp }}/launch-fix/launch-evidence/
          if-no-files-found: ignore
          retention-days: 30
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-trial
          path: candidate
      - name: Verify tested digest and prepare public notes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('candidate'); report=json.loads((root/'validation.json').read_text()); public=root/'public'
          name='Polar-Station-macOS-arm64-TRIAL-UNNOTARIZED.dmg'
          assert {x.name for x in public.iterdir()}=={name,'SHA256SUMS'}
          digest=hashlib.sha256((public/name).read_bytes()).hexdigest()
          assert report['launchservices']['passed'] is True
          assert report['passed'] is True and report['terminal_launch']['terminal_child_executed'] is True
          assert report['source_commit']==os.environ['GITHUB_SHA'] and digest==report['final_dmg_sha256']
          assert (public/'SHA256SUMS').read_text()==digest+'  '+name+'\n'
          assert report['audio_input_entitlement_verified'] is True
          assert report['microphone_usage_description_verified'] is True
          assert report['required_entitlement'] == 'com.apple.security.device.audio-input'
          assert report['original_dmg_sha256'] == 'fb5b65699fae31691d685888312fb44c858b30eef94e521eb059a533df8480aa'
          assert report['application_source_commit'] == '488ca31d32321a4aa070607ac7330a8aba23bc8f'
          assert report['signing_source_commit'] == os.environ['GITHUB_SHA']
          pathlib.Path('notes.md').write_text('Apple Silicon trial: restore com.apple.security.device.audio-input=true in the final main-app signature, allowing the normal macOS microphone permission request. User consent is still required.\n\nThis re-signs and repackages the immutable reviewed trial; it is not a full source recompilation. Nested signatures, helper binaries, resources, full notices and original source/relink documents are unchanged. SIGNING-FIX.txt supplies the exact corrected signing/build source and reproduction instructions. The formal build signer is also corrected.\n\nThe actual final image passed signed microphone capability and usage-description checks, strict signatures, LaunchServices and real terminal execution on macOS. Physical first-permission/recording, Gatekeeper and full GUI acceptance remain separate. Ad-hoc signed, not notarized.\n\nCompiled application source: https://github.com/lionantbear/polar-station/tree/488ca31d32321a4aa070607ac7330a8aba23bc8f\nCorrected signing/build source: https://github.com/lionantbear/polar-station/tree/'+os.environ['GITHUB_SHA']+'\nOriginal source/relink guide: https://github.com/lionantbear/polar-station/blob/9e123d6fbeaeb8bcb6cf024c2e0d71ee4d460f85/docs/releases/macos-trial-488ca31-source-and-relink.md\n\nOriginal release retained: https://github.com/lionantbear/polar-station/releases/tag/macos-arm64-trial-43099863954-1\n\nSHA256: '+digest+'\n')
          PY
      - name: Publish new two-asset prerelease without altering old releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="macos-arm64-trial-microphone-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title 'macOS arm64 trial: microphone permission signature fix' --notes-file notes.md candidate/public/Polar-Station-macOS-arm64-TRIAL-UNNOTARIZED.dmg candidate/public/SHA256SUMS
          gh release view "$tag" --json assets,isDraft --jq '{draft:.isDraft,assets:[.assets[].name]}' > release-state.json
          python3 - <<'PY'
          import json
          value=json.load(open('release-state.json'))
          assert value['draft'] is True and sorted(value['assets'])==['Polar-Station-macOS-arm64-TRIAL-UNNOTARIZED.dmg','SHA256SUMS']
          PY
          mkdir downloaded
          gh release download "$tag" --dir downloaded
          (cd downloaded && sha256sum -c SHA256SUMS)
          cmp candidate/public/SHA256SUMS downloaded/SHA256SUMS
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,assets

  check-public-download:
    needs: publish
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: automation/polar_station
      - name: Download the exact now-public microphone correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/microphone-public"
          mkdir -p "$root/download"
          tag="macos-arm64-trial-microphone-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release download "$tag" --repo lionantbear/polar-station --dir "$root/download"
          cd "$root/download"
          shasum -a 256 -c SHA256SUMS
      - name: Verify final downloaded main capability and real native launch without upload credentials
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          root="$RUNNER_TEMP/microphone-public"
          mkdir "$root/mount" "$root/installed"
          dmg="$root/download/Polar-Station-macOS-arm64-TRIAL-UNNOTARIZED.dmg"
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$root/mount" "$dmg"
          trap 'hdiutil detach "$root/mount"' EXIT
          python3 automation/polar_station/sign_trial_main.py --verify-only "$root/mount/Polar Station.app"
          ditto --rsrc --extattr "$root/mount/Polar Station.app" "$root/installed/Polar Station.app"
          python3 automation/polar_station/sign_trial_main.py --verify-only "$root/installed/Polar Station.app"
          swift automation/polar_station/verify_trial_app.swift --app "$root/installed/Polar Station.app" --report "$root/launchservices.json"
          python3 automation/polar_station/verify_trial_launch.py --app "$root/installed/Polar Station.app" --output "$root/terminal-evidence"
