[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."https://codeberg.org/Lonami/grammers.git"]
grammers-tl-gen = { path = "vendor/grammers-tl-gen" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
codegen-units = 1
incremental = false
lto = "off"
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.test]
debug = 0
incremental = false

[profile.test.package.libsqlite3-sys]
opt-level = 3
