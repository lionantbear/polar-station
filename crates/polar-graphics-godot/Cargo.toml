[package]
name = "polar-graphics-godot"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Godot GDExtension adapter for the data-only Polar force layout"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.4.5", default-features = false, features = ["api-4-3"] }
polar-force-layout-core = { path = "../polar-force-layout-core" }
serde_json = "1"
polar-graphics-package.workspace = true

notify = "=8.2.0"
