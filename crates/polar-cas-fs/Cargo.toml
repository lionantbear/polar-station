[package]
license = "AGPL-3.0-only"
name = "polar-cas-fs"
version = "0.1.0"
edition = "2021"

[features]
default = []
erofs = ["polar-cas-fs-sys/erofs"]
polar = ["erofs", "dep:polar-cas", "dep:rustix"]
async-reader = ["polar", "dep:async-trait", "dep:tokio", "dep:lru"]

[dependencies]
polar-cas-fs-sys = { path = "../polar-cas-fs-sys" }

polar-cas = { path = "../polar-cas", optional = true }
rustix = { version = "=1.1.4", features = ["fs"], optional = true }

async-trait = { version = "0.1", optional = true }
tokio = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
