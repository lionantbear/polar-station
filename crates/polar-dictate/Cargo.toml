[package]
license = "AGPL-3.0-only"
name = "polar-dictate"
version = "0.1.0"
edition = "2021"

[features]
default = []
runtime = ["dep:polar-voice", "dep:tokio", "dep:polar-text-edit", "dep:tracing"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
polar-voice = { workspace = true, optional = true }
polar-text-edit = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
