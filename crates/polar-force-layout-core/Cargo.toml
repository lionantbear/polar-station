[package]
name = "polar-force-layout-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Deterministic, data-only 3D graph layout adapted from pinned d3-force-3d"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "polar-force-oracle"
path = "src/bin/oracle.rs"

