[package]
license = "AGPL-3.0-only"
name = "polar-tmux"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["codex-control", "telegram-channel"]
codex-control = ["polar-station-host/codex-control"]
telegram-channel = ["codex-control", "polar-station-host/telegram-channel"]

[dependencies]
polar-station-host = { workspace = true, default-features = false }
polar-station-client.workspace = true
polar-station-settings.workspace = true
polar-station-protocol.workspace = true
polar-tmux-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
libc = "0.2"
zeroize = "1.8"

[build-dependencies]
cc = "1"
